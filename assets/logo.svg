<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
    .display { font-family: "Space Grotesk", Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, monospace; }
    .caption { font-family: Arial, sans-serif; font-size: 12px; fill: #777777; }
  </style>

  <!-- ============ CONCEPT 1 — BASELINE STORY ============ -->
  <rect x="0" y="0" width="500" height="120" fill="#0f0f0f"/>
  <text class="display" x="52" y="74" font-size="42" letter-spacing="0">
    <tspan fill="#ffffff" font-weight="700">TRU</tspan><tspan fill="#0047FF" font-weight="500" dy="10">sau</tspan><tspan dy="-10" fill="none" stroke="#ffffff" stroke-width="1.3" font-weight="700">WEB</tspan>
  </text>
  <!-- thin baseline rule that the 'sau' dips below -->
  <line x1="52" y1="80" x2="448" y2="80" stroke="#2a2a2a" stroke-width="1"/>
  <text class="caption" x="52" y="146">01 — Solid truth, the soul dips below the baseline, the web is drawn as pure structure (outline).</text>

  <!-- ============ CONCEPT 2 — LOAD-BEARING BLOCK ============ -->
  <rect x="0" y="180" width="500" height="120" fill="#0f0f0f"/>
  <text class="display" x="52" y="254" font-size="42" font-weight="700" fill="#ffffff">TRU</text>
  <rect x="140" y="212" width="86" height="56" fill="#0047FF"/>
  <text class="display" x="183" y="254" font-size="42" font-weight="500" fill="#ffffff" text-anchor="middle">sau</text>
  <text class="display" x="236" y="254" font-size="42" font-weight="700" fill="#ffffff">WEB</text>
  <text class="caption" x="52" y="326">02 — The soul is the load-bearing element: 'sau' set as a solid structural block carrying the name.</text>

  <!-- ============ CONCEPT 3 — THE PATH ============ -->
  <rect x="0" y="360" width="500" height="120" fill="#0f0f0f"/>
  <text class="mono" x="52" y="434" font-size="34">
    <tspan fill="#0047FF">/</tspan><tspan fill="#ffffff">tru</tspan><tspan fill="#0047FF">/</tspan><tspan fill="#ffffff">sau</tspan><tspan fill="#0047FF">/</tspan><tspan fill="#ffffff">web</tspan><tspan fill="#0047FF">_</tspan>
  </text>
  <text class="caption" x="52" y="506">03 — The name as a URL path: an identity that is native to the web, cursor still typing.</text>
</svg>
